
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: support_ticket_management_system_development

test:
  <<: *default
  database: support_ticket_management_system_test

production:
  <<: *default
  database: support_ticket_management_system_production
